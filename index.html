<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Emoji Catch — Laylah's Game</title>
  <style>
    html, body {
      margin: 0; height: 100%;
      background: #1b1035;
      font-family: -apple-system, Arial, sans-serif;
      color: white;
      overscroll-behavior: none; touch-action: none;
      -webkit-user-select: none; user-select: none;
    }
    #wrap { display: flex; flex-direction: column; align-items: center; }
    h1 { margin: 8px; font-size: 20px; }
    canvas {
      background: linear-gradient(#bfe9ff, #eafff0);
      border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      max-width: 96vw; max-height: 88vh;
    }
    p.hint { opacity: 0.7; font-size: 13px; margin: 6px; }
  </style>
</head>
<body>
  <div id="wrap">
    <h1>🎯 Emoji Catch</h1>
    <canvas id="stage" width="420" height="640"></canvas>
    <p class="hint">Tap the character shown up top. Earn points, then unlock cuties in the Store!</p>
  </div>

  <script>
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  // =====================================================================
  //  HAND-DRAWN CUTE CHARACTERS
  //  Each one is a little function that paints a character with code.
  //  (cx, cy) = center, r = how big (roughly the radius).
  //  kawaiiFace() gives them all the same sweet eyes + smile + blush.
  // =====================================================================
  function kawaiiFace(cx, cy, r, opts) {
    opts = opts || {};
    const eyeC = opts.eye || "#3a2b4a";
    // eyes
    ctx.fillStyle = eyeC;
    ctx.beginPath(); ctx.arc(cx - r * 0.30, cy - r * 0.05, r * 0.10, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r * 0.30, cy - r * 0.05, r * 0.10, 0, 7); ctx.fill();
    // tiny eye sparkles
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.beginPath(); ctx.arc(cx - r * 0.33, cy - r * 0.10, r * 0.03, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r * 0.27, cy - r * 0.10, r * 0.03, 0, 7); ctx.fill();
    // blush
    ctx.fillStyle = "rgba(255,120,150,0.45)";
    ctx.beginPath(); ctx.arc(cx - r * 0.46, cy + r * 0.12, r * 0.11, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r * 0.46, cy + r * 0.12, r * 0.11, 0, 7); ctx.fill();
    // smile
    ctx.strokeStyle = eyeC; ctx.lineWidth = Math.max(1.5, r * 0.06); ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(cx, cy + r * 0.04, r * 0.22, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  }

  function fillBlob(cx, cy, r, color) {
    // a wobbly slime/blob body with a bumpy bottom
    ctx.beginPath();
    ctx.moveTo(cx - r, cy + r * 0.55);
    ctx.lineTo(cx - r, cy);
    ctx.arc(cx, cy, r, Math.PI, 0, false);
    ctx.lineTo(cx + r, cy + r * 0.55);
    ctx.quadraticCurveTo(cx + r * 0.66, cy + r * 0.95, cx + r * 0.33, cy + r * 0.6);
    ctx.quadraticCurveTo(cx, cy + r * 1.0, cx - r * 0.33, cy + r * 0.6);
    ctx.quadraticCurveTo(cx - r * 0.66, cy + r * 0.95, cx - r, cy + r * 0.55);
    ctx.closePath();
    ctx.fillStyle = color; ctx.fill();
  }
  function starShape(cx, cy, r, color) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const ang = -Math.PI / 2 + i * Math.PI / 5;
      const rad = i % 2 === 0 ? r : r * 0.45;
      const px = cx + Math.cos(ang) * rad, py = cy + Math.sin(ang) * rad;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  }
  function heartPath(hx, hy, hr) {
    ctx.beginPath();
    ctx.moveTo(hx, hy + hr * 0.75);
    ctx.bezierCurveTo(hx - hr * 1.3, hy - hr * 0.35, hx - hr * 0.35, hy - hr * 0.95, hx, hy - hr * 0.2);
    ctx.bezierCurveTo(hx + hr * 0.35, hy - hr * 0.95, hx + hr * 1.3, hy - hr * 0.35, hx, hy + hr * 0.75);
    ctx.closePath();
  }

  const ART = {
    blobby: function (cx, cy, r) { fillBlob(cx, cy, r, "#7ed957"); kawaiiFace(cx, cy, r); },

    star: function (cx, cy, r) { starShape(cx, cy, r, "#ffd93b"); kawaiiFace(cx, cy - r * 0.05, r * 0.8); },

    ghost: function (cx, cy, r) {
      ctx.beginPath();
      ctx.arc(cx, cy - r * 0.1, r, Math.PI, 0, false);
      ctx.lineTo(cx + r, cy + r * 0.6);
      for (let i = 0; i < 4; i++) {
        const x0 = cx + r - (i * 2 + 1) * (r / 4);
        const x1 = cx + r - (i * 2 + 2) * (r / 4);
        ctx.quadraticCurveTo((x0 + x1) / 2, cy + r * (i % 2 ? 0.6 : 0.95), x1, cy + r * 0.6);
      }
      ctx.closePath(); ctx.fillStyle = "#f5f6ff"; ctx.fill();
      kawaiiFace(cx, cy - r * 0.05, r * 0.9);
    },

    heart: function (cx, cy, r) {
      ctx.beginPath();
      ctx.moveTo(cx, cy + r * 0.7);
      ctx.bezierCurveTo(cx - r * 1.3, cy - r * 0.3, cx - r * 0.4, cy - r * 0.9, cx, cy - r * 0.25);
      ctx.bezierCurveTo(cx + r * 0.4, cy - r * 0.9, cx + r * 1.3, cy - r * 0.3, cx, cy + r * 0.7);
      ctx.closePath(); ctx.fillStyle = "#ff6b9d"; ctx.fill();
      kawaiiFace(cx, cy - r * 0.1, r * 0.7);
    },

    cloud: function (cx, cy, r) {
      ctx.fillStyle = "#ffffff";
      [[0, 0, 0.75], [-0.7, 0.1, 0.55], [0.7, 0.1, 0.55], [-0.35, -0.3, 0.5], [0.35, -0.3, 0.5]]
        .forEach(function (b) { ctx.beginPath(); ctx.arc(cx + b[0] * r, cy + b[1] * r, b[2] * r, 0, 7); ctx.fill(); });
      ctx.fillStyle = "#ffffff"; ctx.fillRect(cx - r * 0.9, cy, r * 1.8, r * 0.35);
      kawaiiFace(cx, cy, r * 0.7);
    },

    bcat: function (cx, cy, r) {
      ctx.fillStyle = "#b39ddb";
      // ears
      ctx.beginPath(); ctx.moveTo(cx - r * 0.7, cy - r * 0.4); ctx.lineTo(cx - r * 0.3, cy - r * 0.95); ctx.lineTo(cx - r * 0.05, cy - r * 0.4); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx + r * 0.7, cy - r * 0.4); ctx.lineTo(cx + r * 0.3, cy - r * 0.95); ctx.lineTo(cx + r * 0.05, cy - r * 0.4); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.85, 0, 7); ctx.fill();
      // whiskers
      ctx.strokeStyle = "rgba(90,60,120,0.6)"; ctx.lineWidth = r * 0.05;
      [-1, 1].forEach(function (s) {
        ctx.beginPath(); ctx.moveTo(cx + s * r * 0.5, cy + r * 0.05); ctx.lineTo(cx + s * r * 1.0, cy - r * 0.05); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx + s * r * 0.5, cy + r * 0.2); ctx.lineTo(cx + s * r * 1.0, cy + r * 0.22); ctx.stroke();
      });
      kawaiiFace(cx, cy + r * 0.05, r * 0.75);
    },

    planet: function (cx, cy, r) {
      ctx.save(); ctx.strokeStyle = "#ffb347"; ctx.lineWidth = r * 0.16;
      ctx.translate(cx, cy); ctx.rotate(-0.35);
      ctx.beginPath(); ctx.ellipse(0, 0, r * 1.35, r * 0.5, 0, 0, 7); ctx.stroke(); ctx.restore();
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.8, 0, 7); ctx.fillStyle = "#5b8dff"; ctx.fill();
      kawaiiFace(cx, cy, r * 0.7);
    },

    dino: function (cx, cy, r) {
      ctx.beginPath(); ctx.ellipse(cx, cy, r * 0.78, r, 0, 0, 7); ctx.fillStyle = "#8ee6c8"; ctx.fill();
      ctx.fillStyle = "rgba(80,180,150,0.7)";
      [[-0.3, -0.4, 0.14], [0.35, -0.2, 0.12], [-0.1, 0.3, 0.13], [0.3, 0.45, 0.1]]
        .forEach(function (s) { ctx.beginPath(); ctx.arc(cx + s[0] * r, cy + s[1] * r, s[2] * r, 0, 7); ctx.fill(); });
      kawaiiFace(cx, cy - r * 0.05, r * 0.7);
    },

    rainbow: function (cx, cy, r) {
      const cols = ["#ff5a5a", "#ffb347", "#ffe14d", "#7ed957", "#5b8dff", "#b06bff"];
      ctx.lineWidth = r * 0.14;
      cols.forEach(function (c, i) {
        ctx.strokeStyle = c;
        ctx.beginPath(); ctx.arc(cx, cy + r * 0.5, r * (1.05 - i * 0.15), Math.PI, 0, false); ctx.stroke();
      });
      // little cloud feet
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(cx - r * 0.95, cy + r * 0.55, r * 0.3, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + r * 0.95, cy + r * 0.55, r * 0.3, 0, 7); ctx.fill();
      kawaiiFace(cx, cy + r * 0.1, r * 0.5);
    },

    gem: function (cx, cy, r) {
      ctx.beginPath();
      ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy - r * 0.2);
      ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r, cy - r * 0.2); ctx.closePath();
      ctx.fillStyle = "#4be3d0"; ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = r * 0.05;
      ctx.beginPath(); ctx.moveTo(cx - r, cy - r * 0.2); ctx.lineTo(cx + r, cy - r * 0.2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r); ctx.stroke();
      kawaiiFace(cx, cy, r * 0.55);
    },

    moon: function (cx, cy, r) {
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fillStyle = "#ffe98a"; ctx.fill();
      ctx.beginPath(); ctx.arc(cx + r * 0.45, cy - r * 0.15, r * 0.85, 0, 7);
      ctx.fillStyle = "#2a1a5e"; ctx.fill();
      // face on the crescent (left side)
      kawaiiFace(cx - r * 0.25, cy + r * 0.05, r * 0.55);
    },

    crownjelly: function (cx, cy, r) {
      fillBlob(cx, cy + r * 0.1, r * 0.9, "#c77dff");
      // little gold crown on top
      ctx.fillStyle = "#ffd93b";
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.55, cy - r * 0.7);
      ctx.lineTo(cx - r * 0.55, cy - r * 1.15); ctx.lineTo(cx - r * 0.25, cy - r * 0.8);
      ctx.lineTo(cx, cy - r * 1.25); ctx.lineTo(cx + r * 0.25, cy - r * 0.8);
      ctx.lineTo(cx + r * 0.55, cy - r * 1.15); ctx.lineTo(cx + r * 0.55, cy - r * 0.7);
      ctx.closePath(); ctx.fill();
      kawaiiFace(cx, cy + r * 0.05, r * 0.72);
    },

    // ---- Laylah's own design: a puppy hugging a heart ----
    puppylove: function (cx, cy, r) {
      const s = r;
      ctx.save(); ctx.translate(cx, cy);
      const BROWN = "#c98a52", DARK = "#9c6636", LIGHT = "#eccea4", RED = "#e5322f", NOSE = "#3a2b2b";

      // wagging tail (behind the body)
      ctx.strokeStyle = BROWN; ctx.lineWidth = 0.16 * s; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(0.55 * s, 0.55 * s);
      ctx.quadraticCurveTo(1.15 * s, 0.45 * s, 1.05 * s, -0.05 * s); ctx.stroke();

      // sitting body + light belly
      ctx.fillStyle = BROWN; ctx.beginPath(); ctx.ellipse(0, 0.45 * s, 0.82 * s, 0.72 * s, 0, 0, 7); ctx.fill();
      ctx.fillStyle = LIGHT; ctx.beginPath(); ctx.ellipse(0, 0.58 * s, 0.5 * s, 0.5 * s, 0, 0, 7); ctx.fill();

      // back feet
      ctx.fillStyle = LIGHT;
      ctx.beginPath(); ctx.ellipse(-0.52 * s, 0.98 * s, 0.24 * s, 0.15 * s, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0.52 * s, 0.98 * s, 0.24 * s, 0.15 * s, 0, 0, 7); ctx.fill();

      // the heart she's hugging
      ctx.fillStyle = RED; heartPath(0, 0.5 * s, 0.46 * s); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.35)"; // shine
      ctx.beginPath(); ctx.ellipse(-0.16 * s, 0.32 * s, 0.09 * s, 0.13 * s, -0.4, 0, 7); ctx.fill();

      // front paws wrapped around the heart
      ctx.fillStyle = LIGHT;
      ctx.beginPath(); ctx.ellipse(-0.44 * s, 0.55 * s, 0.19 * s, 0.15 * s, -0.5, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0.44 * s, 0.55 * s, 0.19 * s, 0.15 * s, 0.5, 0, 7); ctx.fill();

      // head
      ctx.fillStyle = BROWN; ctx.beginPath(); ctx.ellipse(0, -0.35 * s, 0.62 * s, 0.58 * s, 0, 0, 7); ctx.fill();
      // muzzle
      ctx.fillStyle = LIGHT; ctx.beginPath(); ctx.ellipse(0, -0.12 * s, 0.34 * s, 0.26 * s, 0, 0, 7); ctx.fill();
      // brown patch around one eye (like her drawing)
      ctx.fillStyle = DARK; ctx.beginPath(); ctx.ellipse(0.24 * s, -0.42 * s, 0.26 * s, 0.3 * s, 0, 0, 7); ctx.fill();
      // floppy ears
      ctx.fillStyle = DARK;
      ctx.beginPath(); ctx.ellipse(-0.52 * s, -0.4 * s, 0.2 * s, 0.36 * s, -0.6, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0.52 * s, -0.4 * s, 0.2 * s, 0.36 * s, 0.6, 0, 7); ctx.fill();

      // eyes + sparkles
      ctx.fillStyle = "#2a2020";
      ctx.beginPath(); ctx.arc(-0.22 * s, -0.34 * s, 0.12 * s, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(0.24 * s, -0.34 * s, 0.12 * s, 0, 7); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.95)";
      ctx.beginPath(); ctx.arc(-0.25 * s, -0.38 * s, 0.04 * s, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(0.21 * s, -0.38 * s, 0.04 * s, 0, 7); ctx.fill();
      // nose + mouth + tongue
      ctx.fillStyle = NOSE; ctx.beginPath(); ctx.ellipse(0, -0.16 * s, 0.1 * s, 0.08 * s, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = NOSE; ctx.lineWidth = 0.035 * s;
      ctx.beginPath(); ctx.moveTo(0, -0.08 * s); ctx.lineTo(0, -0.02 * s); ctx.stroke();
      ctx.fillStyle = "#ff7d8a"; ctx.beginPath(); ctx.ellipse(0, 0.03 * s, 0.08 * s, 0.06 * s, 0, 0, 7); ctx.fill();
      // blushy cheeks
      ctx.fillStyle = "rgba(255,120,150,0.4)";
      ctx.beginPath(); ctx.arc(-0.42 * s, -0.13 * s, 0.1 * s, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(0.42 * s, -0.13 * s, 0.1 * s, 0, 7); ctx.fill();

      ctx.restore();
    },

    bee: function (cx, cy, r) {
      ctx.fillStyle = "rgba(185,222,255,0.75)";
      ctx.beginPath(); ctx.ellipse(cx - r * 0.5, cy - r * 0.5, r * 0.5, r * 0.34, -0.6, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx + r * 0.5, cy - r * 0.5, r * 0.5, r * 0.34, 0.6, 0, 7); ctx.fill();
      ctx.fillStyle = "#ffd23b"; ctx.beginPath(); ctx.ellipse(cx, cy + r * 0.1, r * 0.8, r * 0.68, 0, 0, 7); ctx.fill();
      ctx.save(); ctx.beginPath(); ctx.ellipse(cx, cy + r * 0.1, r * 0.8, r * 0.68, 0, 0, 7); ctx.clip();
      ctx.fillStyle = "#3a2b2b"; ctx.fillRect(cx - r, cy - r * 0.12, r * 2, r * 0.16); ctx.fillRect(cx - r, cy + r * 0.28, r * 2, r * 0.16); ctx.restore();
      ctx.strokeStyle = "#3a2b2b"; ctx.lineWidth = r * 0.05; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(cx - r * 0.2, cy - r * 0.52); ctx.lineTo(cx - r * 0.32, cy - r * 0.85); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + r * 0.2, cy - r * 0.52); ctx.lineTo(cx + r * 0.32, cy - r * 0.85); ctx.stroke();
      ctx.fillStyle = "#3a2b2b"; ctx.beginPath(); ctx.arc(cx - r * 0.32, cy - r * 0.88, r * 0.06, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + r * 0.32, cy - r * 0.88, r * 0.06, 0, 7); ctx.fill();
      kawaiiFace(cx, cy, r * 0.6);
    },

    mushroom: function (cx, cy, r) {
      ctx.fillStyle = "#f3e2c0";
      ctx.beginPath(); ctx.moveTo(cx - r * 0.45, cy + r * 0.1);
      ctx.quadraticCurveTo(cx - r * 0.5, cy + r * 0.9, cx - r * 0.28, cy + r * 0.95);
      ctx.lineTo(cx + r * 0.28, cy + r * 0.95);
      ctx.quadraticCurveTo(cx + r * 0.5, cy + r * 0.9, cx + r * 0.45, cy + r * 0.1); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#e5443c"; ctx.beginPath(); ctx.arc(cx, cy + r * 0.12, r * 0.85, Math.PI, 0, false); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.92)";
      [[-0.4, -0.2, 0.14], [0.32, -0.3, 0.12], [0.52, 0.0, 0.1], [-0.05, -0.45, 0.1]]
        .forEach(function (s) { ctx.beginPath(); ctx.arc(cx + s[0] * r, cy + s[1] * r, s[2] * r, 0, 7); ctx.fill(); });
      kawaiiFace(cx, cy + r * 0.5, r * 0.46);
    },

    avocado: function (cx, cy, r) {
      ctx.fillStyle = "#4c7a34"; ctx.beginPath(); ctx.ellipse(cx, cy, r * 0.72, r * 0.95, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#c7e29b"; ctx.beginPath(); ctx.ellipse(cx, cy, r * 0.52, r * 0.72, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#8a5a2b"; ctx.beginPath(); ctx.arc(cx, cy + r * 0.3, r * 0.27, 0, 7); ctx.fill();
      kawaiiFace(cx, cy - r * 0.22, r * 0.46);
    },

    strawberry: function (cx, cy, r) {
      ctx.fillStyle = "#e5322f"; ctx.beginPath();
      ctx.moveTo(cx, cy + r * 0.95);
      ctx.bezierCurveTo(cx - r * 0.9, cy + r * 0.4, cx - r * 0.8, cy - r * 0.5, cx, cy - r * 0.5);
      ctx.bezierCurveTo(cx + r * 0.8, cy - r * 0.5, cx + r * 0.9, cy + r * 0.4, cx, cy + r * 0.95);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ffe9a8";
      [[-0.3, 0.05], [0.3, 0.05], [0, 0.3], [-0.34, 0.45], [0.34, 0.45], [0, -0.18], [-0.12, 0.6], [0.12, 0.6]]
        .forEach(function (s) { ctx.save(); ctx.translate(cx + s[0] * r, cy + s[1] * r); ctx.rotate(0.3); ctx.beginPath(); ctx.ellipse(0, 0, r * 0.05, r * 0.09, 0, 0, 7); ctx.fill(); ctx.restore(); });
      ctx.fillStyle = "#3fae57";
      for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(cx, cy - r * 0.35); ctx.lineTo(cx + i * r * 0.3, cy - r * 0.85); ctx.lineTo(cx + i * r * 0.3 + r * 0.18, cy - r * 0.4); ctx.closePath(); ctx.fill(); }
      kawaiiFace(cx, cy + r * 0.08, r * 0.46);
    },

    cactus: function (cx, cy, r) {
      ctx.fillStyle = "#4fae5a";
      roundRect(cx - r * 0.28, cy - r * 0.7, r * 0.56, r * 1.2, r * 0.26); ctx.fill();
      roundRect(cx - r * 0.72, cy - r * 0.3, r * 0.26, r * 0.55, r * 0.13); ctx.fill();
      roundRect(cx + r * 0.46, cy - r * 0.5, r * 0.26, r * 0.55, r * 0.13); ctx.fill();
      ctx.fillRect(cx - r * 0.5, cy - r * 0.05, r * 0.28, r * 0.16);
      ctx.fillRect(cx + r * 0.22, cy - r * 0.22, r * 0.28, r * 0.16);
      ctx.fillStyle = "#e08a5b"; ctx.beginPath();
      ctx.moveTo(cx - r * 0.42, cy + r * 0.5); ctx.lineTo(cx + r * 0.42, cy + r * 0.5);
      ctx.lineTo(cx + r * 0.32, cy + r * 0.98); ctx.lineTo(cx - r * 0.32, cy + r * 0.98); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#c9743f"; ctx.fillRect(cx - r * 0.48, cy + r * 0.42, r * 0.96, r * 0.14);
      kawaiiFace(cx, cy - r * 0.12, r * 0.4);
    },

    penguin: function (cx, cy, r) {
      ctx.fillStyle = "#2b2b3a"; ctx.beginPath(); ctx.ellipse(cx, cy, r * 0.72, r * 0.92, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(cx, cy + r * 0.14, r * 0.46, r * 0.64, 0, 0, 7); ctx.fill();
      ctx.fillStyle = "#ff9f2e";
      ctx.beginPath(); ctx.ellipse(cx - r * 0.28, cy + r * 0.92, r * 0.2, r * 0.1, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx + r * 0.28, cy + r * 0.92, r * 0.2, r * 0.1, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx, cy - r * 0.02); ctx.lineTo(cx - r * 0.16, cy + r * 0.16); ctx.lineTo(cx + r * 0.16, cy + r * 0.16); ctx.closePath(); ctx.fill();

      ctx.lineTo(cx + r * 0.75, cy + r * 0.5); ctx.closePath(); ctx.fill();

      kawaiiFace(cx, cy + r * 0.18, r * 0.4);

    rainbowstar: function (cx, cy, r) {

      kawaiiFace(cx, cy, r * 0.5);
    },
  };

  const BYID = {};

  // draw any catalog item by its id, centered at (x,y), sized to sizePx tall
  function renderItem(id, x, y, sizePx) {

  const LEVEL_GOALS = [0, 100, 250, 450, 700, 1000, 1400, 1900];

  // =====================================================================
  const SAVE_KEY = "emojiCatchSave2";   // v2 because the catalog changed
  let save;
  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      save = raw ? JSON.parse(raw) : { points: 0, unlocked: [] };
    } catch (e) { save = { points: 0, unlocked: [] }; }
    const set = new Set(save.unlocked);
    STARTERS.forEach(function (e) { set.add(e); });
    save.unlocked = Array.from(set);
    if (typeof save.points !== "number") save.points = 0;
    if (typeof save.muted !== "boolean") save.muted = false;
    if (typeof save.totalCatches !== "number") save.totalCatches = 0;  // emojis caught, all time
    if (typeof save.bestStreak !== "number") save.bestStreak = 0;      // longest correct streak
    if (typeof save.maxLevel !== "number") save.maxLevel = 1;          // highest level reached
    if (typeof save.scene !== "string") save.scene = "default";        // unlocked background scene

    { id: "rainbowstar", how: "Catch 1000 emojis",   done: function () { return save.totalCatches >= 1000; }, progress: function () { return save.totalCatches + " / 1000"; } },
  ];
  let achToast = null;  // { id, life } — the "New Award!" banner
  function checkAchievements() {
    for (const a of ACHIEVEMENTS) {
      if (!owned(a.id) && a.done()) {
        save.unlocked.push(a.id); writeSave();
        achToast = { id: a.id, life: 200 };   // ~3.3 seconds
        playFanfare();
      }

  }
  function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

  // =====================================================================
  //  SCREENS

  let screen = "start";
  let storeReturn = "start";
  let storeMsg = "";
  let pendingBuy = null;

  let game;
  function startGame() {
    game = { score: 0, earned: 0, hearts: 3, level: 1, targets: [], falling: [], floaters: [], spawnTimer: 0, pause: 0, flash: 0, paused: false, streak: 0, scene: save.scene,
             age: 0, portalState: "waiting", portalAt: 240 + Math.floor(Math.random() * 600) };
    pickTargets(); screen = "playing";
  }
  function pickTargets() {
    const howMany = Math.min(game.level, 4, save.unlocked.length);
    const shuffled = [...save.unlocked].sort(function () { return Math.random() - 0.5; });
    game.targets = shuffled.slice(0, howMany);
  }
  function fallSpeed()  { return 1.4 + game.level * 0.5; }
  function spawnEvery() { return Math.max(28, 70 - game.level * 6); }

  // =====================================================================
  //  GAME LOOP
  // =====================================================================
  function loop() {
    if (screen === "playing" && !game.paused) { if (game.pause > 0) game.pause--; else update(); }
    draw();
    requestAnimationFrame(loop);
  }
  function update() {
    game.spawnTimer++;
    if (game.spawnTimer >= spawnEvery()) { game.spawnTimer = 0; spawnEmoji(); }

    // the secret portal appears exactly ONCE per game, at a surprise moment,
    // darting in from a top corner
    game.age++;
    if (game.portalState === "waiting" && game.age >= game.portalAt) {
      game.portalState = "active";
      const fromLeft = Math.random() < 0.5;
      game.falling.push({ portal: true, x: fromLeft ? 24 : W - 24, y: 100, size: 14, vx: fromLeft ? 5 : -5, vy: 1, dartTimer: 0 });
    }

    // move everything (portal darts, everything else falls straight)
    for (const e of game.falling) { if (e.portal) movePortal(e); else e.y += fallSpeed(); }
    game.falling = game.falling.filter(function (e) {
      if (e.y - 30 > H) {
        if (e.portal) { game.portalState = "done"; return false; }   // missed it — gone for this game
        if (game.targets.includes(e.id)) {
          game.score = Math.max(0, game.score - 5);
          addFloater(e.x, H - 70, "-5", "#ff4d4d", 40, 80);
        }
        return false;
      }
      return true;
    });
    game.floaters = game.floaters.filter(function (f) { f.y -= 0.8; f.life -= 1; return f.life > 0; });
    if (game.flash > 0) game.flash -= 0.05;
    const nextGoal = LEVEL_GOALS[game.level];
    if (nextGoal !== undefined && game.score >= nextGoal) {
      game.level++; pickTargets();
      if (game.level > save.maxLevel) { save.maxLevel = game.level; writeSave(); }
      game.pause = 108; game.falling = []; game.floaters = []; game.spawnTimer = 0;
      playLevelUp();
      checkAchievements();
    }
  }
  function spawnEmoji() {
    let id;
    if (Math.random() < 0.45) id = game.targets[Math.floor(Math.random() * game.targets.length)];
    else id = save.unlocked[Math.floor(Math.random() * save.unlocked.length)];
    game.falling.push({ id: id, x: 30 + Math.random() * (W - 60), y: -20, size: 44 });
  }
  // The secret portal darts around instead of falling straight, drifting down
  // bit by bit so it eventually slips off the bottom if you don't catch it.
  function movePortal(e) {
    e.dartTimer -= 1;
    if (e.dartTimer <= 0) {                 // pick a new zig-zag direction
      e.vx = (Math.random() * 2 - 1) * 6;
      e.vy = 0.8 + Math.random() * 1.7;     // always some downward drift
      e.dartTimer = 12 + Math.floor(Math.random() * 26);
    }
    e.x += e.vx; e.y += e.vy;
    if (e.x < 16) { e.x = 16; e.vx = Math.abs(e.vx); }        // bounce off the walls
    if (e.x > W - 16) { e.x = W - 16; e.vx = -Math.abs(e.vx); }
  }
  function addFloater(x, y, text, color, size, life) {

  }

  // =====================================================================
  //  TAPPING
  // =====================================================================
  function handleTap(clientX, clientY) {
    ensureAudio();   // make sure sound is ready (needs a tap to start on iPads)
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * (W / rect.width);
    const y = (clientY - rect.top) * (H / rect.height);
    if (screen === "playing")  return tapGame(x, y);
    if (screen === "start")    return tapStart(x, y);
    if (screen === "gameover") return tapGameOver(x, y);
    if (screen === "store")    return tapStore(x, y);
    if (screen === "collection") return tapCollection(x, y);
    if (screen === "help")     return tapHelp(x, y);
    if (screen === "awards")   return tapAwards(x, y);
  }
  function tapGame(x, y) {
    // If paused, only the pause-menu buttons work
    if (game.paused) {
      if (hit(RESUME_BTN, x, y)) game.paused = false;
      else if (hit(QUIT_BTN, x, y)) screen = "start";
      return;
    }
    if (game.pause > 0) return;                     // ignore taps during level-up freeze
    if (hit(MUTE_BTN, x, y)) { toggleMute(); return; }
    if (hit(PAUSE_BTN, x, y)) { game.paused = true; return; }
    for (let i = game.falling.length - 1; i >= 0; i--) {
      const e = game.falling[i];
      const dx = x - e.x, dy = y - e.y;
      const hitR = e.portal ? e.size + 16 : e.size;   // portal is small, so give it a kinder hitbox
      if (dx * dx + dy * dy < hitR * hitR) {
        if (e.portal) {
          // 🌈 secret portal! big bonus + switch to the Party scene
          game.score += 20; game.earned += 20; save.points += 20;
          game.streak++; save.totalCatches++;
          if (game.streak > save.bestStreak) save.bestStreak = game.streak;
          writeSave();
          game.scene = "party";
          game.portalState = "done";
          addFloater(e.x, e.y, "+20 PARTY!", "#ff5aa7", 30, 75);
          playFanfare();
          checkAchievements();
        } else if (game.targets.includes(e.id)) {
          game.score += 10; game.earned += 10; save.points += 10;
          game.streak++; save.totalCatches++;
          if (game.streak > save.bestStreak) save.bestStreak = game.streak;
          writeSave();
          addFloater(e.x, e.y, "+10", "#2ecc71");
          playCatch(e.id);
          checkAchievements();
        } else { game.streak = 0; loseHeart(); addFloater(e.x, e.y, "💔", "#ff4d4d"); playWrong(); }
        game.falling.splice(i, 1);
        return;
      }
    }
  }
  function loseHeart() { game.hearts--; game.flash = 1; if (game.hearts <= 0) { game.hearts = 0; screen = "gameover"; } }

  // ---- SECRET tap pattern: tap the 4 cuties under the title left->right->left ----
  const DECO_Y = 235, DECO_X = [W / 2 - 105, W / 2 - 35, W / 2 + 35, W / 2 + 105];
  const SKY_PATTERN = [0, 1, 2, 3, 2, 1, 0];
  let skySeq = [];
  function detectSkyTaps(x, y) {
    for (let i = 0; i < 4; i++) {
      const dx = x - DECO_X[i], dy = y - DECO_Y;
      if (dx * dx + dy * dy < 34 * 34) {
        if (skySeq[skySeq.length - 1] !== i) skySeq.push(i);  // ignore repeated taps on the same cutie
        if (skySeq.length > 12) skySeq = skySeq.slice(-12);
        let ok = skySeq.length >= SKY_PATTERN.length;
        for (let k = 0; ok && k < SKY_PATTERN.length; k++) {
          if (skySeq[skySeq.length - SKY_PATTERN.length + k] !== SKY_PATTERN[k]) ok = false;
        }
        if (ok) { skySeq = []; toggleSky(); }
        return;
      }
    }
  }
  function toggleSky() {
    save.scene = (save.scene === "sky") ? "default" : "sky";

  function shareGame() {

      ctx.fillText("drag up for more  ⌄", W / 2, H - 12);
    }
  }
  function tapGameOver(x, y) {
    if (hit(GO_PLAY, x, y)) return startGame();
    if (hit(GO_CUTIES, x, y)) { screen = "collection"; storeScroll = 0; return; }
    if (hit(GO_AWARDS, x, y)) { screen = "awards"; return; }
    if (hit(GO_STORE, x, y)) return openStore("gameover");
    if (hit(GO_SHARE, x, y)) { shareGame(); return; }
  }
  function openStore(from) { storeReturn = from; screen = "store"; pendingBuy = null; storeMsg = ""; storeScroll = 0; }

  function tapStore(x, y) {
    if (pendingBuy) {
      if (hit(BUY_YES, x, y)) {
        save.points -= pendingBuy.price; save.unlocked.push(pendingBuy.id); writeSave();
        storeMsg = "Unlocked " + itemLabel(pendingBuy.id) + "!"; pendingBuy = null; playBuy();
      } else if (hit(BUY_NO, x, y)) { pendingBuy = null; }
      return;
    }
    if (hit(STORE_BACK, x, y)) { screen = storeReturn; return; }
    if (hit(STORE_PLAY, x, y)) { return startGame(); }
    const active = limitedActiveItem();
    if (active && y > STORE_HEADER && hit(specialRect(), x, y)) { tryBuy(active); return; }
    for (let i = 0; i < STORE_GRID.length; i++) {
      const r = storeTile(i);
      if (y > STORE_HEADER && hit(r, x, y)) { tryBuy(STORE_GRID[i]); return; }
    }
  }
  function tryBuy(item) {
    if (owned(item.id)) storeMsg = "You already have " + itemLabel(item.id);
    else if (save.points >= item.price) { pendingBuy = item; storeMsg = ""; }
    else storeMsg = "Save up " + item.price + " for " + itemLabel(item.id) + "!";
  }

  // =====================================================================
  //  DRAWING
  // =====================================================================
  function draw() {
    ctx.clearRect(0, 0, W, H);
    if (screen === "start")    drawStart();
    if (screen === "playing")  drawGame();
    if (screen === "gameover") drawGameOver();
    if (screen === "store")    drawStore();
    if (screen === "collection") drawCollection();
    if (screen === "help")     drawHelp();
    if (screen === "awards")   drawAwards();
  }

  function drawGame() {
    drawScene(game.scene);   // paint the background scene first
    for (const e of game.falling) {
      if (e.portal) drawPortal(e.x, e.y, e.size);
      else renderItem(e.id, e.x, e.y, e.size);
    }
    for (const f of game.floaters) {
      ctx.globalAlpha = Math.max(0, f.life / f.maxLife);
      ctx.fillStyle = f.color; ctx.font = "bold " + f.size + "px -apple-system, Arial";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(f.text, f.x, f.y); ctx.globalAlpha = 1;
    }
    drawTopBar();
    if (game.flash > 0) { ctx.fillStyle = "rgba(255,0,0," + (game.flash * 0.35) + ")"; ctx.fillRect(0, 0, W, H); }
    if (game.pause > 0) drawLevelUp();
    // the little pause + mute buttons (hidden during level-up freeze and while paused)
    if (game.pause === 0 && !game.paused) {
      drawButton(PAUSE_BTN, "⏸", "#6c5ce7", 18);
      drawButton(MUTE_BTN, save.muted ? "🔇" : "🔊", "#6c5ce7", 16);
    }
    if (achToast) drawAchToast();
    if (game.paused) drawPauseMenu();
  }

  function drawAchToast() {
    achToast.life--;
    if (achToast.life <= 0) { achToast = null; return; }
    const a = achToast, bx = 30, bw = W - 60, by = 100, bh = 92;
    ctx.globalAlpha = Math.min(1, achToast.life / 30);   // gentle fade at the end
    roundRect(bx, by, bw, bh, 16); ctx.fillStyle = "rgba(20,10,40,0.94)"; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "#ffd23b"; ctx.stroke();
    renderItem(a.id, bx + 50, by + bh / 2, 60);
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffd23b"; ctx.font = "bold 19px -apple-system, Arial";
    ctx.fillText("🏆 New Award!", bx + 96, by + 26);
    ctx.fillStyle = "white"; ctx.font = "bold 17px -apple-system, Arial";
    ctx.fillText(itemLabel(a.id), bx + 96, by + 50);
    ctx.fillStyle = "#9fe8ff"; ctx.font = "13px -apple-system, Arial";
    ctx.fillText("Earned, not bought!", bx + 96, by + 72);
    ctx.globalAlpha = 1;
  }

  function drawPauseMenu() {
    ctx.fillStyle = "rgba(27,16,53,0.92)"; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "white"; ctx.font = "bold 46px -apple-system, Arial";

    drawButton(QUIT_BTN, "⏹  Quit to Menu", "#e74c3c");
  }
  function drawTopBar() {
    ctx.fillStyle = "rgba(27,16,53,0.9)"; ctx.fillRect(0, 0, W, 88);
    ctx.textBaseline = "middle"; ctx.fillStyle = "white"; ctx.textAlign = "left";
    ctx.font = "bold 16px -apple-system, Arial";
    ctx.fillText("Find:", 12, 22);
    // draw each target character next to "Find:"
    let tx = 66;
    for (const id of game.targets) { renderItem(id, tx, 22, 30); tx += 36; }
    // hearts — drawn as SHAPES (not emoji) so they show the same on every device.
    // Always 3 slots: a filled red heart for each life left, a gray outline for lost ones.
    for (let i = 0; i < 3; i++) {
      const hx = W - 70 + i * 26, hy = 20, hr = 9;
      heartPath(hx, hy, hr);
      if (i < game.hearts) { ctx.fillStyle = "#ff4d6d"; ctx.fill(); }
      else { ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 2; ctx.stroke(); }
    }
    // score + piggy bank
    ctx.font = "bold 15px -apple-system, Arial"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffd93b"; ctx.textAlign = "left";
    ctx.fillText("Lvl " + game.level + " · ⭐ " + game.score, 12, 48);
    ctx.textAlign = "right"; ctx.fillStyle = "#ffe08a";
    ctx.fillText("🪙 " + save.points, W - 12, 48);

    // ---- progress toward the next level ----
    const nextGoal = LEVEL_GOALS[game.level];       // score needed to level up
    const bx = 12, bw = W - 24, by = 76, bh = 8;
    ctx.fillStyle = "rgba(255,255,255,0.18)"; roundRect(bx, by, bw, bh, 4); ctx.fill();  // track
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (nextGoal !== undefined) {
      const prevGoal = LEVEL_GOALS[game.level - 1] || 0;
      const prog = Math.max(0, Math.min(1, (game.score - prevGoal) / (nextGoal - prevGoal)));
      ctx.fillStyle = "#7ee0ff"; roundRect(bx, by, Math.max(bh, bw * prog), bh, 4); ctx.fill();
      const need = Math.max(1, Math.ceil((nextGoal - game.score) / 10));
      ctx.fillStyle = "#cdefff"; ctx.font = "bold 13px -apple-system, Arial";
      ctx.fillText("Catch " + need + " more to reach Level " + (game.level + 1) + "!", W / 2, 64);
    } else {
      ctx.fillStyle = "#ffd93b"; roundRect(bx, by, bw, bh, 4); ctx.fill();
      ctx.fillStyle = "#ffd93b"; ctx.font = "bold 13px -apple-system, Arial";
      ctx.fillText("★ MAX LEVEL — you're a champion! ★", W / 2, 64);
    }
  }
  function drawLevelUp() {

  function drawTile(item, r) {
    const isOwned = owned(item.id), canAfford = save.points >= item.price;
    let bg = "rgba(255,255,255,0.12)";
    if (isOwned) bg = "rgba(46,204,113,0.30)";
    else if (!canAfford) bg = "rgba(255,255,255,0.05)";
    roundRect(r.x, r.y, r.w, r.h, 12); ctx.fillStyle = bg; ctx.fill();
    ctx.globalAlpha = isOwned || canAfford ? 1 : 0.4;
    renderItem(item.id, r.x + r.w / 2, r.y + r.h / 2 - 8, 38);
    ctx.globalAlpha = 1;
    ctx.font = "bold 12px -apple-system, Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (isOwned) { ctx.fillStyle = "#8effa0"; ctx.fillText("✓ owned", r.x + r.w / 2, r.y + r.h - 13); }
    else { ctx.fillStyle = canAfford ? "#ffe08a" : "#bbb"; ctx.fillText("🪙" + item.price, r.x + r.w / 2, r.y + r.h - 13); }
  }

  function drawSpecialBanner(item, r) {
    const isOwned = owned(item.id), canAfford = save.points >= item.price;
    roundRect(r.x, r.y, r.w, r.h, 16); ctx.fillStyle = "rgba(255,90,167,0.22)"; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "#ffd23b"; ctx.stroke();
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffd23b"; ctx.font = "bold 15px -apple-system, Arial";
    ctx.fillText("✨ LIMITED EDITION ✨", r.x + r.w / 2, r.y + 18);
    renderItem(item.id, r.x + 50, r.y + r.h / 2 + 8, 56);
    ctx.textAlign = "left";
    ctx.fillStyle = "white"; ctx.font = "bold 17px -apple-system, Arial";
    ctx.fillText(item.name, r.x + 96, r.y + 46);
    if (isOwned) { ctx.fillStyle = "#8effa0"; ctx.font = "bold 15px -apple-system, Arial"; ctx.fillText("✓ You got it!", r.x + 96, r.y + 70); }
    else { ctx.fillStyle = canAfford ? "#ffe08a" : "#ffb0b0"; ctx.font = "bold 16px -apple-system, Arial"; ctx.fillText("🪙 " + item.price, r.x + 96, r.y + 70); }
    ctx.fillStyle = "#7ee0ff"; ctx.font = "bold 13px -apple-system, Arial";

  function drawStore() {

  // ---- helpers ----
  function bgFill() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#2a1a5e"); g.addColorStop(1, "#1b1035");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  // ---- background scenes (easter eggs!) ----
  function drawCloud(cx, cy, r) {
    ctx.fillStyle = "rgba(255,255,255,0.92)";
    [[0, 0, 1], [-0.7, 0.12, 0.62], [0.7, 0.12, 0.62], [-0.35, -0.25, 0.55], [0.4, -0.2, 0.55]]
      .forEach(function (b) { ctx.beginPath(); ctx.arc(cx + b[0] * r, cy + b[1] * r, b[2] * r, 0, 7); ctx.fill(); });
    ctx.fillRect(cx - r * 0.7, cy, r * 1.4, r * 0.42);
  }
  function drawScene(s) {
    if (s === "sky") {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#6fc0ff"); g.addColorStop(1, "#d8f0ff");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      drawCloud(75, 150, 34); drawCloud(330, 250, 42); drawCloud(150, 400, 38);
      drawCloud(320, 520, 30); drawCloud(70, 580, 30);
    } else if (s === "party") {
      // disco: horizontal bands whose colours cycle over time
      const cols = ["#ff6b6b", "#ffb84d", "#ffe14d", "#7ed957", "#5b8dff", "#b06bff"];
      const shift = Math.floor(Date.now() / 140) % cols.length, n = 6, bandH = H / n;
      for (let i = 0; i < n; i++) {
        ctx.globalAlpha = 0.6; ctx.fillStyle = cols[(i + shift) % cols.length];
        ctx.fillRect(0, i * bandH, W, bandH + 1);
      }
      ctx.globalAlpha = 1;
    } else {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#bfe9ff"); g.addColorStop(1, "#eafff0");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
  }
  // the secret rainbow portal: a swirl with rainbow dots circling it
  // a small dark core wrapped in ONE spinning rainbow ring
  function drawPortal(cx, cy, r) {
    const t = Date.now() / 250;
    const cols = ["#ff5a5a", "#ffb347", "#ffe14d", "#7ed957", "#5b8dff", "#b06bff"];
    const seg = Math.PI * 2 / cols.length;
    ctx.lineWidth = r * 0.55;
    for (let i = 0; i < cols.length; i++) {
      ctx.strokeStyle = cols[i];
      ctx.beginPath(); ctx.arc(cx, cy, r * 1.15, t + i * seg, t + (i + 1) * seg + 0.05); ctx.stroke();
    }
    ctx.fillStyle = "rgba(42,26,94,0.9)"; ctx.beginPath(); ctx.arc(cx, cy, r * 0.85, 0, 7); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(cx, cy, r * 0.3, 0, 7); ctx.fill();
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function drawButton(rect, label, bg, fontSize) {
    roundRect(rect.x, rect.y, rect.w, rect.h, 16); ctx.fillStyle = bg; ctx.fill();
    ctx.fillStyle = "white"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "bold " + (fontSize || 24) + "px -apple-system, Arial";
    ctx.fillText(label, rect.x + rect.w / 2, rect.y + rect.h / 2 + 1);
  }
  function hit(rect, x, y) { return x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h; }

  const BTN_PLAY  = { x: 90, y: 314, w: 240, h: 56 };
  const BTN_STORE = { x: 90, y: 380, w: 240, h: 56 };
  const BTN_COLLECTION = { x: 90, y: 446, w: 240, h: 56 };
  const BTN_AWARDS = { x: 90, y: 512, w: 240, h: 56 };
  const PAUSE_BTN = { x: W - 46, y: 86, w: 36, h: 34 };
  const MUTE_BTN  = { x: W - 46, y: 126, w: 36, h: 34 };
  const MUTE_MENU = { x: W - 52, y: 14, w: 40, h: 34 };
  const HELP_MENU = { x: 12, y: 14, w: 40, h: 34 };
  const SHARE_MENU = { x: 58, y: 14, w: 40, h: 34 };
  // Game Over screen: Play Again (wide), then a 2x2 grid of Cuties/Awards/Store/Share
  const GO_PLAY   = { x: 60, y: 296, w: 300, h: 54 };
  const GO_CUTIES = { x: 40, y: 362, w: 170, h: 54 };
  const GO_AWARDS = { x: 210, y: 362, w: 170, h: 54 };
  const GO_STORE  = { x: 40, y: 424, w: 170, h: 54 };
  const GO_SHARE  = { x: 210, y: 424, w: 170, h: 54 };
  const RESUME_BTN = { x: 90, y: H / 2 - 10, w: 240, h: 64 };
  const QUIT_BTN = { x: 90, y: H / 2 + 74, w: 240, h: 64 };
  const STORE_BACK = { x: 12, y: 10, w: 96, h: 40 };
  const STORE_PLAY = { x: W - 108, y: 10, w: 96, h: 40 };
  const BUY_YES = { x: 40, y: H / 2 + 20, w: 150, h: 64 };
  const BUY_NO  = { x: W - 190, y: H / 2 + 20, w: 150, h: 64 };
  const STORE_HEADER = 58;
  let storeScroll = 0;

  // 5 columns; the whole grid slides up/down by storeScroll when there are lots of items
  const TILE_H = 82, ROW_GAP = 8, GRID_TOP = STORE_HEADER + 8, SPECIAL_H = 132;
  const WEEK = 7 * 24 * 60 * 60 * 1000;
  const STORE_GRID = CATALOG.filter(function (c) { return !c.limited && !c.achievement; });
  const LIMITEDS = CATALOG.filter(function (c) { return c.limited; });

  // Which limited-edition character is available right now — it rotates weekly,
  // using the real calendar so every player sees the same one at the same time.
  function limitedActiveItem() {
    if (LIMITEDS.length === 0) return null;
    return LIMITEDS[Math.floor(Date.now() / WEEK) % LIMITEDS.length];
  }
  function limitedTimeLeft() {
    return (Math.floor(Date.now() / WEEK) + 1) * WEEK - Date.now();
  }
  function countdownText(ms) {
    const d = Math.floor(ms / 86400000), h = Math.floor(ms / 3600000) % 24, m = Math.floor(ms / 60000) % 60;
    if (d > 0) return d + "d " + h + "h left";
    if (h > 0) return h + "h " + m + "m left";
    return m + "m left";
  }

  // Collection screen tiles (no limited banner above them)
  function tileRect(i) {
    const cols = 5, tileW = 74, gap = 8, startX = 11;
    const c = i % cols, r = Math.floor(i / cols);
    return { x: startX + c * (tileW + gap), y: GRID_TOP + r * (TILE_H + ROW_GAP) - storeScroll, w: tileW, h: TILE_H };
  }
  // Store grid tiles (pushed down to make room for the limited banner)
  function storeTile(i) {
    const cols = 5, tileW = 74, gap = 8, startX = 11;
    const top = GRID_TOP + (limitedActiveItem() ? SPECIAL_H : 0);
    const c = i % cols, r = Math.floor(i / cols);
    return { x: startX + c * (tileW + gap), y: top + r * (TILE_H + ROW_GAP) - storeScroll, w: tileW, h: TILE_H };
  }
  function specialRect() {
    return { x: 34, y: GRID_TOP - storeScroll, w: W - 68, h: SPECIAL_H - 16 };
  }
  function currentMaxScroll() {
    let top = GRID_TOP, count;
    if (screen === "store") { top += (limitedActiveItem() ? SPECIAL_H : 0); count = STORE_GRID.length; }
    else { count = save.unlocked.length; }
    const rows = Math.ceil(count / 5);
    return Math.max(0, top + rows * (TILE_H + ROW_GAP) - (H - 44));
  }
  function clampScroll() {
    const m = currentMaxScroll();
    if (storeScroll < 0) storeScroll = 0;
    if (storeScroll > m) storeScroll = m;
  }

  // =====================================================================
  //  SOUND EFFECTS  (made with code — no sound files needed!)
  //  The browser can create beeps and boings on the fly.
  // =====================================================================
  let ac = null, masterGain = null, audioUnlocked = false;
  function ensureAudio() {
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = ac.createGain(); masterGain.gain.value = 0.7;
        masterGain.connect(ac.destination);
      } catch (e) { ac = null; }
    }
    if (!ac) return;
    // iPads need audio "woken up" by a tap — resume the sound engine...
    if (ac.state === "suspended") ac.resume();
    // ...and play a tiny burst of silence, which fully unlocks audio on iOS.
    if (!audioUnlocked) {
      try {
        const b = ac.createBuffer(1, 1, 22050);
        const s = ac.createBufferSource(); s.buffer = b;
        s.connect(ac.destination); s.start(0);
        audioUnlocked = true;
      } catch (e) {}
    }
  }
  // a simple tone that slides from one pitch to another
  function beep(f1, f2, type, dur, vol, when) {
    if (!ac || save.muted) return;
    const t = ac.currentTime + (when || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t + dur + 0.02);
  }
  // the "boing!" — pitch springs up then bounces back down
  function playBoing() {
    if (!ac || save.muted) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(220, t);
    o.frequency.exponentialRampToValueAtTime(680, t + 0.06);
    o.frequency.exponentialRampToValueAtTime(200, t + 0.24);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    o.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t + 0.32);
  }
  function playWrong()   { beep(180, 90, "square", 0.22, 0.25); }
  function playLevelUp() { beep(523, 523, "triangle", 0.12, 0.3, 0); beep(659, 659, "triangle", 0.12, 0.3, 0.12); beep(784, 784, "triangle", 0.18, 0.3, 0.24); }
  function playBuy()     { beep(784, 784, "triangle", 0.1, 0.3, 0); beep(1047, 1047, "triangle", 0.16, 0.3, 0.1); }
  function playFanfare() { beep(523, 523, "triangle", 0.14, 0.3, 0); beep(659, 659, "triangle", 0.14, 0.3, 0.14); beep(784, 784, "triangle", 0.14, 0.3, 0.28); beep(1047, 1047, "triangle", 0.32, 0.32, 0.42); }
  function toggleMute()  { save.muted = !save.muted; writeSave(); if (!save.muted) playBoing(); }

  // ---- animal + food sounds: the browser actually SAYS the sound out loud ----
  // (This uses the device's built-in voice, so it needs no sound files and
  //  says a real, recognizable word — much better than beeps for a meow/woof.)
  // ---- animal + food sounds, built from noise + filters (plays on every device) ----
  // A quick burst of filtered white noise — the building block for barks & munches.
  function noiseBurst(dur, type, freq, q, vol, when) {
    if (!ac || save.muted) return;
    const t = ac.currentTime + (when || 0);
    const n = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; if (q) f.Q.value = q;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(masterGain);
    src.start(t); src.stop(t + dur + 0.02);
  }
  // A gliding tone, optionally shaped by a bandpass filter (for vowel-ish sounds).
  function tone(f1, f2, type, dur, vol, when, filterFreq, filterQ) {
    if (!ac || save.muted) return;
    const t = ac.currentTime + (when || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.linearRampToValueAtTime(f2, t + dur);
    let node = o;
    if (filterFreq) { const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = filterFreq; if (filterQ) bp.Q.value = filterQ; o.connect(bp); node = bp; }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t + dur + 0.02);
  }

  function playMeow() {  // rising-then-falling "eee-ow" with a vowel filter sweep
    if (!ac || save.muted) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
    o.type = "sawtooth"; f.type = "bandpass"; f.Q.value = 5;
    o.frequency.setValueAtTime(650, t);
    o.frequency.linearRampToValueAtTime(920, t + 0.14);
    o.frequency.linearRampToValueAtTime(600, t + 0.5);
    f.frequency.setValueAtTime(1100, t);
    f.frequency.linearRampToValueAtTime(1900, t + 0.14);
    f.frequency.linearRampToValueAtTime(850, t + 0.5);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.32, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
    o.connect(f); f.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t + 0.57);
  }
  function bark(when, base) {  // one cute little "woof" — higher & bouncy = puppy yip
    if (!ac || save.muted) return;
    const t = ac.currentTime + when;
    const o = ac.createOscillator(), bp = ac.createBiquadFilter(), g = ac.createGain();
    o.type = "sawtooth";
    // quick swoop up then down = a bouncy "wu-of"
    o.frequency.setValueAtTime(base * 0.6, t);
    o.frequency.linearRampToValueAtTime(base * 1.3, t + 0.03);
    o.frequency.linearRampToValueAtTime(base * 0.75, t + 0.13);
    // bright vowel sweep, like the cat's, kept high & friendly
    bp.type = "bandpass"; bp.Q.value = 3;
    bp.frequency.setValueAtTime(800, t);
    bp.frequency.linearRampToValueAtTime(1600, t + 0.03);
    bp.frequency.linearRampToValueAtTime(750, t + 0.13);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.38, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    o.connect(bp); bp.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t + 0.17);
  }
  function playWoof() { bark(0, 320); bark(0.16, 380); }  // two happy yips, second a bit higher
  function croak(f1, f2, when, dur) {  // throaty two-syllable "ri-bbit" — tonal, no wobble
    if (!ac || save.muted) return;
    const t = ac.currentTime + when;
    const o = ac.createOscillator(), bp = ac.createBiquadFilter(), g = ac.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(f1, t);
    o.frequency.linearRampToValueAtTime(f2, t + dur);
    bp.type = "bandpass"; bp.frequency.value = 600; bp.Q.value = 4;   // throaty formant
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(bp); bp.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function playRibbit() { croak(200, 150, 0, 0.1); croak(250, 330, 0.12, 0.17); }  // "rib" (down) + "bit" (up)
  function playRoar() { noiseBurst(0.5, "lowpass", 500, 1, 0.4, 0); tone(120, 70, "sawtooth", 0.5, 0.35, 0); }
  function playBuzz() {
    if (!ac || save.muted) return;
    const t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
    o.type = "sawtooth"; o.frequency.value = 175;
    lfo.type = "square"; lfo.frequency.value = 50; lg.gain.value = 0.12; lfo.connect(lg); lg.connect(g.gain);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
    o.connect(g); g.connect(masterGain);
    o.start(t); o.stop(t + 0.34); lfo.start(t); lfo.stop(t + 0.34);
  }
  function playYum() {  // a happy "mmm-mm!" hum — warm sine, like tasting something yummy
    tone(300, 300, "sine", 0.16, 0.34, 0);
    tone(400, 460, "sine", 0.26, 0.36, 0.15);   // second note lifts up = delighted
  }

  // Which emoji makes which sound. Anything not listed just goes "boing!"
  const SOUND_MAP = {
    "🐱": playMeow, "bcat": playMeow, "partycat": playMeow, "graycat": playMeow, "orangecat": playMeow,
    "🐶": playWoof,
    "🐸": playRibbit,
    "🐉": playRoar, "dino": playRoar,
    "bee": playBuzz,
    "🍎": playYum, "🍕": playYum, "🍩": playYum, "avocado": playYum, "strawberry": playYum, "mushroom": playYum,
  };
  function playCatch(id) { (SOUND_MAP[id] || playBoing)(); }

  // On the store/collection screens you can DRAG to scroll; a tap that barely
  // moves counts as a tap. Everywhere else, a touch taps right away.
  let tStartX = 0, tStartY = 0, tLastY = 0, tMoved = false;
  function scrollable() { return screen === "store" || screen === "collection"; }

  canvas.addEventListener("touchstart", function (e) {
    e.preventDefault();
    const t = e.changedTouches[0];
    tStartX = t.clientX; tStartY = t.clientY; tLastY = t.clientY; tMoved = false;
    if (!scrollable()) handleTap(t.clientX, t.clientY);
  });
  canvas.addEventListener("touchmove", function (e) {
    e.preventDefault();
    if (!scrollable()) return;
    const t = e.changedTouches[0];
    const rect = canvas.getBoundingClientRect();
    storeScroll -= (t.clientY - tLastY) * (H / rect.height);
    tLastY = t.clientY;
    clampScroll();
    if (Math.abs(t.clientY - tStartY) > 8) tMoved = true;
  }, { passive: false });
  canvas.addEventListener("touchend", function (e) {
    if (scrollable() && !tMoved) handleTap(tStartX, tStartY);
  });

  canvas.addEventListener("mousedown", function (e) { handleTap(e.clientX, e.clientY); });
  canvas.addEventListener("wheel", function (e) {
    if (scrollable()) { e.preventDefault(); storeScroll += e.deltaY; clampScroll(); }
  }, { passive: false });

  // Extra safety: flush the save whenever the app is closed or backgrounded,
  // so a purchase can never be lost between sessions.
  window.addEventListener("pagehide", writeSave);
  document.addEventListener("visibilitychange", function () { if (document.hidden) writeSave(); });

  loadSave();
  loop();
  </script>
